services:
  - type: web
    name: orvexia-backend
    runtime: node
    rootDir: backend/express
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://orvexiaaiautomation.vercel.app
      - key: CORS_ORIGINS
        value: https://orvexiaaiautomation.vercel.app,http://localhost:5173
      - key: BACKEND_PUBLIC_URL
        value: https://orvexia-backend-82dw.onrender.com
      - key: OAUTH_PUBLIC_URL
        value: https://orvexia-backend-82dw.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 24h
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_BOT_SCOPES
        value: chat:write,channels:read,groups:read,incoming-webhook
      - key: NOTION_CLIENT_ID
        sync: false
      - key: NOTION_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: APPS_SCRIPT_WEBHOOK_URL
        sync: false
      - key: MAIL_WEBHOOK_SECRET
        sync: false
